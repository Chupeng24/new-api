name: Platform workflow regression
on:
  workflow_dispatch:
  push:
    branches: ['feat/industry-llm-platform']
    paths: ['model/platform*', 'controller/platform*', 'router/platform*', 'service/authz/resources_platform.go', 'web/src/features/platform/**', '.github/workflows/platform-tests.yml']
permissions:
  contents: read
jobs:
  database-matrix:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-password
          MYSQL_DATABASE: platform_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./model -run TestPlatform -count=1
        env:
          PLATFORM_TEST_MYSQL_DSN: root:disposable-test-password@tcp(127.0.0.1:3306)/platform_test?charset=utf8mb4&parseTime=True&loc=Local
          PLATFORM_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=disposable-test-password dbname=platform_test sslmode=disable
      - run: go test ./controller -run TestPlatform -count=1
      - run: go test ./service/authz ./router -count=1
